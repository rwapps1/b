<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared</title>

<!--
  HOW THIS PAGE WORKS
  --------------------
  This page has no build step and no page list to maintain. On load it asks
  the GitHub API for the contents of the repository it is currently being
  served from, and turns every .html file (and every subfolder) it finds
  into a tile below. Add a new page to the repo, refresh this page, and a
  new tile appears automatically -- nothing in this file needs to change.

  It figures out which repository to ask about from the URL it's running
  on (works for both project pages like username.github.io/my-repo/ and
  user pages like username.github.io/). If you're using a custom domain,
  or testing locally, auto-detection won't have a github.io hostname to
  read -- just set it explicitly below and it'll be used instead:

    <meta name="github-repo" content="your-username/your-repo-name">

  Copy this file into any other repository as-is and it will pick up
  that repository's own files and icons the next time it loads.
-->
<meta name="github-repo" content="">

<style>
  :root {
    --bg:      #eef3fb;
    --card-bg: #ffffff;
    --ink:     #212b3d;
    --mist:    #8593a8;
    --badge-bg: #dce9f9;
    --badge-icon: #4a76ad;
    --card-shadow: rgba(30, 60, 110, 0.08);
    --card-shadow-hover: rgba(30, 60, 110, 0.14);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    padding: 56px 20px 40px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0 auto 56px;
  }

  .badge {
    width: 52px;
    height: 52px;
    border-radius: 15px;
    background: var(--badge-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .badge svg { width: 26px; height: 26px; color: var(--badge-icon); }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--ink);
  }

  main {
    max-width: 900px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 24px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 34px 16px 26px;
    text-align: center;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 3px 14px var(--card-shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transition: box-shadow 0.2s ease;
  }
  .card:hover, .card:focus-visible {
    box-shadow: 0 8px 22px var(--card-shadow-hover);
  }
  .card:focus-visible {
    outline: 2px solid var(--badge-icon);
    outline-offset: 3px;
  }

  .icon-wrap {
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .icon-wrap svg { width: 100%; height: 100%; }

  .card:hover .icon-wrap, .card:focus-visible .icon-wrap {
    transform: scale(1.18) translateY(-2px);
  }

  .card-name {
    font-size: 0.95rem;
    font-weight: 500;
    word-break: break-word;
    line-height: 1.3;
  }

  .status {
    text-align: center;
    color: var(--mist);
    font-size: 0.95rem;
    max-width: 440px;
    margin: 10px auto 0;
    line-height: 1.5;
    grid-column: 1 / -1;
  }
  .status.error { color: #b0645a; }

  @media (prefers-reduced-motion: reduce) {
    .icon-wrap, .card { transition: none; }
    .card:hover .icon-wrap, .card:focus-visible .icon-wrap { transform: none; }
  }
</style>
</head>
<body>

<header>
  <span class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/>
      <path d="M8.2 10.6l7.6-4.2M8.2 13.4l7.6 4.2"/>
    </svg>
  </span>
  <h1>Shared</h1>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="status" id="status">Loading&hellip;</div>
</main>

<script>
(function () {
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');

  // ---- Icon library: keyword -> {svg, color} (first match wins) ----
  // svg paths use currentColor, tinted per-item via the "color" field.
  const ICONS = [
    { keys: ['people','team','staff','adviser','advisor','client','member','hr','user','users'], color: '#5b3a6e',
      svg: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm6-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 13c-3 0-6 1.5-6 4v2h9v-2c0-1.1.4-2.1 1.1-2.9C12.1 13.4 10.5 13 9 13zm6.4.1c-.5 0-1 .05-1.5.13.9.95 1.4 2.2 1.4 3.57v2.2H21v-2c0-2.5-2.9-3.9-5.6-3.9z"/></svg>' },
    { keys: ['excel','spreadsheet','report','chart','data','analytics','dashboard','stats'], color: '#3f8fd6',
      svg: '<svg viewBox="0 0 24 24"><rect x="3" y="13" width="4.5" height="8" rx="1" fill="#2fae7e"/><rect x="9.75" y="7" width="4.5" height="14" rx="1" fill="#e0448c"/><rect x="16.5" y="3" width="4.5" height="18" rx="1" fill="#3f8fd6"/></svg>' },
    { keys: ['resume','cv','doc','document','paper','pdf'], color: '#8b6fae',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h6"/></svg>' },
    { keys: ['contact','mail','email'], color: '#4a90c4',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 6 10-6"/></svg>' },
    { keys: ['about','info','profile','bio'], color: '#5b7fa6',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>' },
    { keys: ['project','portfolio','work','case'], color: '#38507a',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' },
    { keys: ['game','games','play','arcade'], color: '#4caf7d',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M8 10v4M6 12h4"/><circle cx="16" cy="10.5" r="1" fill="currentColor" stroke="none"/><circle cx="18" cy="13.5" r="1" fill="currentColor" stroke="none"/></svg>' },
    { keys: ['map','travel','trip','location','places'], color: '#e0735a',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>' },
    { keys: ['code','dev','api','script'], color: '#5a6472',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/></svg>' },
    { keys: ['calendar','schedule','event','plan'], color: '#c75b7a',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>' },
    { keys: ['shop','store','shopping','cart'], color: '#c9973a',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="21" r="1" fill="currentColor" stroke="none"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.6a2 2 0 0 0 2-1.6L23 6H6"/></svg>' },
    { keys: ['book','library','read','story','stories'], color: '#2f7a6e',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>' },
    { keys: ['recipe','food','cook','kitchen','menu'], color: '#c1694a',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2v8a2 2 0 0 1-2 2h0M16 2v20M8 2v6a2 2 0 0 0 2 2 2 2 0 0 0 2-2V2M10 10v12"/></svg>' },
    { keys: ['photo','gallery','image','picture','pictures','pics'], color: '#d6708f',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5" fill="currentColor" stroke="none"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg>' },
    { keys: ['video','movie','film','clip'], color: '#c9484a',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 9l5-3v12l-5-3"/></svg>' },
    { keys: ['music','audio','song','sound','podcast'], color: '#2f9e8f',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>' },
    { keys: ['blog','post','article','journal','diary','writing'], color: '#d9a441',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>' },
    { keys: ['tool','utility','settings','config','admin','setup'], color: '#8a8f98',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9L6.7 20.3a2.1 2.1 0 0 1-3-3L10.6 10.5a6 6 0 0 1 7.9-7.9z"/></svg>' }
  ];
  const FOLDER_ICON  = { color: '#8a8f98', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>' };
  const DEFAULT_ICON = { color: '#8b6fae', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h6"/></svg>' };

  function pickIcon(name, isDir) {
    const lower = name.toLowerCase();
    for (const entry of ICONS) {
      if (entry.keys.some(k => lower.includes(k))) return entry;
    }
    return isDir ? FOLDER_ICON : DEFAULT_ICON;
  }

  function toTitle(name) {
    return name
      .replace(/\.(html?|htm)$/i, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase())
      .trim();
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // Files/folders we never want to show as a tile.
  const SKIP_FILES = new Set(['index.html', 'readme.md', 'license', 'license.md', '_config.yml', 'cname', '.nojekyll', '404.html']);
  const SKIP_DIRS  = new Set(['assets', 'css', 'js', 'images', 'img', 'static', 'node_modules', '.github', '.git', 'fonts']);

  function detectRepo() {
    const override = document.querySelector('meta[name="github-repo"]');
    if (override && override.content && override.content.includes('/')) {
      const [owner, repo] = override.content.trim().split('/');
      return { owner, repo };
    }
    const host = window.location.hostname;
    if (host.endsWith('.github.io')) {
      const owner = host.split('.')[0];
      const parts = window.location.pathname.split('/').filter(Boolean);
      const repo = parts.length > 0 ? parts[0] : (owner + '.github.io');
      return { owner, repo };
    }
    return null;
  }

  function showStatus(msg, isError) {
    status.textContent = msg;
    status.className = 'status' + (isError ? ' error' : '');
  }

  function clearStatus() {
    status.textContent = '';
    status.className = 'status';
  }

  async function loadItems() {
    const info = detectRepo();
    if (!info) {
      showStatus('Could not detect a repository from this URL. If you\'re using a custom domain or testing locally, set <meta name="github-repo" content="owner/repo"> in the page head.', true);
      return;
    }

    try {
      const res = await fetch('https://api.github.com/repos/' + info.owner + '/' + info.repo + '/contents/');
      if (!res.ok) {
        if (res.status === 403) {
          showStatus('GitHub API rate limit reached. Try refreshing again in a little while.', true);
        } else if (res.status === 404) {
          showStatus('Repository "' + info.owner + '/' + info.repo + '" wasn\'t found, or isn\'t public.', true);
        } else {
          showStatus('Could not load the repository contents right now.', true);
        }
        return;
      }

      const contents = await res.json();
      const items = contents.filter(item => {
        const lower = item.name.toLowerCase();
        if (item.type === 'file') {
          if (SKIP_FILES.has(lower)) return false;
          return /\.html?$/i.test(item.name);
        }
        if (item.type === 'dir') {
          if (SKIP_DIRS.has(lower) || lower.startsWith('.')) return false;
          return true;
        }
        return false;
      }).sort((a, b) => a.name.localeCompare(b.name));

      if (items.length === 0) {
        showStatus('No pages here yet.', false);
        return;
      }

      clearStatus();

      grid.innerHTML = items.map(item => {
        const isDir = item.type === 'dir';
        const href = isDir ? encodeURIComponent(item.name) + '/' : encodeURIComponent(item.name);
        const title = escapeHtml(toTitle(item.name));
        const icon = pickIcon(item.name, isDir);
        return '<a class="card" href="' + href + '" target="_blank" rel="noopener noreferrer">' +
                 '<span class="icon-wrap" style="color:' + icon.color + '">' + icon.svg + '</span>' +
                 '<span class="card-name">' + title + '</span>' +
               '</a>';
      }).join('');

    } catch (err) {
      showStatus('Something went wrong loading the repository. Check your connection and try again.', true);
    }
  }

  loadItems();
})();
</script>

</body>
</html>
